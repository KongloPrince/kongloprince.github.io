<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Recipe Box</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #fff7ec;
      color: #3b2a1a;
      margin: 0;
      padding: 24px 16px 48px;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { text-align: center; font-size: 2rem; margin-bottom: 4px; }
    .sub { text-align: center; margin-top: 0; color: #7a5c3e; }
    form, .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin: 16px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    label { display: block; font-weight: 600; margin-top: 8px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 2px solid #e8d5bb;
      border-radius: 8px;
      font: inherit;
    }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #e8742a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .card h3 { margin: 0 0 6px; }
    .card p { margin: 0; white-space: pre-wrap; }
    #message { text-align: center; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <h1>🍲 My Recipe Box</h1>
    <p class="sub">Add a recipe and it gets saved forever!</p>

    <form id="recipe-form">
      <label for="name">Recipe name</label>
      <input id="name" required maxlength="100" placeholder="Jollof rice">

      <label for="ingredients">Ingredients</label>
      <textarea id="ingredients" rows="4" maxlength="1000" placeholder="Rice, tomatoes, onions, pepper..."></textarea>

      <button type="submit" id="save-btn">Save recipe</button>
    </form>

    <p id="message"></p>
    <div id="list"></div>
  </main>

  <script>
    var SUPABASE_URL = "https://gourlqaomykzmhnxuepq.supabase.co";
    var SUPABASE_KEY = "sb_publishable_pOiDWNFeOsjJ9-VdURLXUA_Z4N9t49C";
    var API = SUPABASE_URL + "/rest/v1/recipes";
    var headers = {
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json"
    };

    var listEl = document.getElementById("list");
    var msgEl = document.getElementById("message");
    var form = document.getElementById("recipe-form");
    var btn = document.getElementById("save-btn");

    function showRecipes(recipes) {
      listEl.innerHTML = "";
      if (recipes.length === 0) {
        msgEl.textContent = "No recipes yet. Add your first one! 👆";
        return;
      }
      msgEl.textContent = "";
      recipes.forEach(function (r) {
        var card = document.createElement("div");
        card.className = "card";
        var h = document.createElement("h3");
        h.textContent = r.name;
        var p = document.createElement("p");
        p.textContent = r.ingredients || "";
        card.appendChild(h);
        card.appendChild(p);
        listEl.appendChild(card);
      });
    }

    async function loadRecipes() {
      try {
        var res = await fetch(API + "?select=*&order=created_at.desc", { headers: headers });
        if (!res.ok) throw new Error("Could not load recipes");
        showRecipes(await res.json());
      } catch (e) {
        msgEl.textContent = "Oops! Could not load recipes. 😢";
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      var name = document.getElementById("name").value.trim();
      var ingredients = document.getElementById("ingredients").value.trim();
      if (!name) return;

      btn.disabled = true;
      try {
        var res = await fetch(API, {
          method: "POST",
          headers: Object.assign({ "Prefer": "return=minimal" }, headers),
          body: JSON.stringify({ name: name, ingredients: ingredients })
        });
        if (!res.ok) throw new Error("Could not save");
        form.reset();
        await loadRecipes();
        msgEl.textContent = "Saved! ✅";
      } catch (e) {
        msgEl.textContent = "Oops! Could not save. 😢";
      }
      btn.disabled = false;
    });

    loadRecipes();
  </script>
</body>
</html>
